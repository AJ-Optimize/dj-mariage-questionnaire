<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ | Rendez-vous mariage</title><style>
:root{font-family:system-ui,sans-serif;color:#243039;background:#f3f5f5;accent-color:#16766e}*{box-sizing:border-box}body{margin:0}header{background:#183d3b;color:white;padding:24px  max(20px,calc((100% - 1100px)/2));}h1{font-size:27px;margin:4px 0}header p{margin:6px 0;color:#d0e3df}.layout{max-width:1140px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:20px}aside{position:sticky;top:16px;align-self:start}nav a{display:block;padding:10px 12px;text-decoration:none;color:#335653;border-radius:8px;font-size:14px}nav a:hover{background:#dcebe7}.panel,section{background:white;border:1px solid #dce3e1;border-radius:12px;padding:22px;margin-bottom:16px}h2{font-size:20px;margin:0 0 16px}h3{font-size:15px;margin:20px 0 10px}label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}input:not([type=checkbox]),textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd6d3;border-radius:7px;background:#fcfdfd;font:inherit;color:inherit}textarea{min-height:65px;resize:vertical}.field{margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.checks label{font-weight:400;display:flex;align-items:center;gap:7px;padding:8px;background:#f5f8f7;border-radius:6px;margin:0}button{background:#16766e;color:white;border:0;border-radius:7px;padding:10px 14px;font:inherit;cursor:pointer}button.secondary{background:#e7efed;color:#214b46}button.danger{background:#fff0ef;color:#9b3838}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #16766e;outline-offset:2px}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;color:#62736f}.bar{height:7px;background:#e1e9e6;border-radius:9px;overflow:hidden;margin:8px 0}.bar span{display:block;background:#16766e;height:100%;width:0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:7px 4px;border-bottom:1px solid #edf0ef}td select{padding:6px}section{scroll-margin-top:14px}.status{min-height:18px}.note{font-size:13px;color:#526863} @media(max-width:760px){.layout{display:block}aside{position:static}nav{display:none}.grid,.checks{grid-template-columns:1fr}}@media print{body{background:white}header{background:white;color:black;padding:0}header p{color:black}aside,.actions,.no-print{display:none!important}.layout{display:block;margin:0;padding:0}section{break-inside:avoid;border:0;padding:8px 0}textarea{display:none}.print-value{white-space:pre-wrap;display:block!important;border-bottom:1px solid #ccc;padding:5px 0}input:not([type=checkbox]),select{display:none}h2{font-size:17px}.checks label{background:white}}.print-value{display:none}
</style></head><body><header><p>FICHE CLIENT · ENTRETIEN EN VISIO</p><h1>Préparation DJ — Mariage</h1><p>Un support de discussion, pas un interrogatoire.</p></header><div class="layout"><aside><div class="panel"><strong>Mon rendez-vous</strong><div class="bar"><span id="progress"></span></div><div id="count" class="small"></div><nav id="nav"></nav><hr><div class="small status" id="status" role="status"></div><div class="actions"><button onclick="exportText()">Exporter le bilan</button><button class="secondary" onclick="window.print()">Imprimer / PDF</button><button class="secondary" onclick="backup()">Sauvegarder JSON</button><button class="secondary" onclick="document.getElementById('import').click()">Importer JSON</button><input type="file" id="import" accept=".json,application/json" hidden><button class="danger" onclick="resetForm()">Nouveau dossier</button></div><p class="small">Les données restent dans ce navigateur. Exporte un JSON pour conserver chaque dossier ou le rouvrir ailleurs.</p></div></aside><main id="main"></main></div><script>
const sections=[
['Informations générales',[['text','Noms des mariés'],['date','Date du mariage'],['text','Lieu et adresse'],['text','Téléphone / e-mail'],['text','Invités au cocktail / repas / soirée'],['text','Profil des invités (âges, cultures…)'],['area','Thème, couleurs, prestataires déjà choisis']]],
['Attentes & ambiance',[['area','Comment imaginez-vous votre soirée ?'],['check','Ambiance recherchée',['Élégante','Conviviale','Romantique','Très festive','Ambiance club']],['choice','Interventions au micro',['Discrètes','Ponctuelles','Animation active','À définir']],['area','Attentes envers le DJ, expériences appréciées ou à éviter']]],
['Déroulement',[['area','Planning prévisionnel et horaires des temps forts'],['check','Moments nécessitant mon intervention',['Cérémonie laïque','Cocktail','Entrée en salle','Repas','Discours / animations','Dessert','Ouverture du bal','Soirée dansante']],['text','Début / fin de prestation'],['area','Musiques des temps forts déjà identifiées']]],
['Préférences musicales',[['area','Artistes et styles préférés'],['area','Ambiance musicale cocktail / repas'],['genres','Styles pour la soirée'],['area','Titres incontournables (Must Play)'],['area','Titres / artistes interdits (Do Not Play)'],['choice','Demandes musicales des invités',['Oui','Oui, avec filtrage DJ','Non','À définir']],['area','Liberté musicale, playlists à partager, autres préférences']]],
['Animations & temps forts',[['choice','Animations souhaitées',['Oui','Non','À définir']],['choice','Organisation des animations',['Proches','DJ','Les deux','À définir']],['check','Temps forts envisagés',['Discours','Surprises','Projection vidéo','Jeux','Danses entre les plats','Lancer du bouquet','Chorégraphie / montage musical']],['area','Animations envisagées / à éviter, traditions, ouverture du bal']]],
['Matériel & ambiance visuelle',[['area','Espaces à sonoriser, matériel fourni par le lieu, ambiance lumineuse'],['check','Besoins à confirmer',['Sonorisation cocktail','Sonorisation cérémonie','Micros sans fil','Éclairage piste','Éclairage architectural','Vidéoprojecteur / écran','Brouillard / fumée','Fumée lourde','Étincelles froides','Montage musical']],['area','Contraintes ou options particulières (effets soumis à autorisation)']]],
['Organisation & coordination',[['area','Référents et coordonnées (témoins, traiteur, lieu…)'],['choice','Contact direct avec proches et prestataires',['Oui','Non','À confirmer']],['area','Restrictions horaires / sonores, accès et installation'],['choice','Visite technique possible',['Oui','Non','À confirmer']],['choice','Repas DJ prévu',['Oui','Non','À confirmer']]]],
['Prestation & prochaines étapes',[['text','Budget / tarif envisagé'],['date','Date du prochain rendez-vous'],['area','Demandes particulières et points à confirmer'],['area','Pour vous, qu’est-ce qu’une soirée réussie ?'],['area','Mes notes personnelles / actions à mener']]],
['Suivi après rendez-vous',[['check','Éléments récupérés ou validés',['Planning définitif','Plan de salle','Contacts témoins','Contacts prestataires','Playlist incontournables','Liste titres interdits','Musiques des temps forts','Fichiers des animations','Besoins matériels','Horaires de prestation']],['area','Éléments en attente / échéances']]]];
const genres=['Années 70 / 80','Années 90','Années 2000','Années 2010 / 2020','Disco / Funk','Variété française','Pop internationale','Rock / Pop Rock','House / Electro / Dance','Rap / Hip-Hop','R&B / Soul','Latino / Reggaeton','Afro / Dancehall','Musiques traditionnelles','Musiques festives populaires','Slows'];
const key='dj-mariage-v1';const main=document.getElementById('main');const nav=document.getElementById('nav');const el=(tag,txt)=>{let e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;return e};let fields=[];
function control(type,id,label,options,parent){let c;if(type==='area')c=el('textarea');else if(type==='choice'){c=el('select');for(let v of ['Non renseigné',...options]){let o=el('option',v);o.value=v==='Non renseigné'?'':v;c.append(o)}}else{c=el('input');c.type=type}c.id=id;c.dataset.label=label;c.setAttribute('aria-label',label);parent.append(c);if(type!=='checkbox'){let p=el('span');p.className='print-value';parent.append(p);c.print=p}fields.push(c);return c}
sections.forEach(([name,items],i)=>{let section=el('section');section.id='s'+i;let link=el('a',(i+1)+'. '+name);link.href='#'+section.id;nav.append(link);section.append(el('h2',(i+1)+'. '+name));items.forEach(([type,label,opts],j)=>{let id='f'+i+'_'+j;let wrap=el('div');wrap.className='field';let l=el('label',label);l.htmlFor=id;wrap.append(l);if(type==='check'){let box=el('div');box.className='checks';opts.forEach((v,k)=>{let lab=el('label');let c=control('checkbox',id+'_'+k,label+' — '+v,null,lab);lab.append(document.createTextNode(v));box.append(lab)});wrap.append(box)}else if(type==='genres'){let table=el('table');let tr=el('tr');tr.append(el('th','Style'),el('th','Préférence'));table.append(tr);genres.forEach((g,k)=>{let r=el('tr'),cell=el('td');r.append(el('td',g),cell);control('choice',id+'_'+k,g,['Adoré','Apprécié','Indifférent','À éviter'],cell);table.append(r)});wrap.append(table)}else control(type,id,label,opts,wrap);section.append(wrap)});main.append(section)});
function collect(){return Object.fromEntries(fields.map(c=>[c.id,c.type==='checkbox'?c.checked:c.value]))}function update(){let n=0;sections.forEach((s,i)=>{if(fields.some(c=>c.id.startsWith('f'+i+'_')&&(c.type==='checkbox'?c.checked:c.value.trim())))n++});document.getElementById('progress').style.width=(n/sections.length*100)+'%';document.getElementById('count').textContent=n+' / '+sections.length+' rubriques commencées';fields.forEach(c=>{if(c.print)c.print.textContent=c.value||'—'})}function save(){update();try{localStorage.setItem(key,JSON.stringify(collect()));document.getElementById('status').textContent='Sauvegarde locale effectuée'}catch(e){document.getElementById('status').textContent='Sauvegarde locale indisponible : exporte un JSON.'}}function load(data){fields.forEach(c=>{let v=data[c.id];if(c.type==='checkbox')c.checked=v===true;else c.value=typeof v==='string'?v:''});update()}try{load(JSON.parse(localStorage.getItem(key)||'{}'))}catch(e){update()}main.addEventListener('input',save);main.addEventListener('change',save);function download(content,name,type){let url=URL.createObjectURL(new Blob([content],{type}));let a=el('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function filename(){return 'DJ-mariage-'+(fields[0].value.trim().replace(/[^\p{L}\p{N}-]+/gu,'-')||'dossier')}function backup(){download(JSON.stringify({version:1,answers:collect()},null,2),filename()+'.json','application/json')}function exportText(){let out=['PRÉPARATION DJ — MARIAGE'];sections.forEach(([name],i)=>{out.push('\n'+(i+1)+'. '+name.toUpperCase());fields.filter(c=>c.id.startsWith('f'+i+'_')).forEach(c=>{if(c.type==='checkbox'){if(c.checked)out.push('✓ '+c.dataset.label)}else if(c.value.trim())out.push(c.dataset.label+' : '+c.value)})});download(out.join('\n'),filename()+'.txt','text/plain;charset=utf-8')}function resetForm(){if(confirm('Effacer le dossier courant ? Sauvegardez-le en JSON auparavant si nécessaire.')){load({});save()}}document.getElementById('import').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.version!==1||!data.answers||typeof data.answers!=='object'||Array.isArray(data.answers))throw Error();if(confirm('Remplacer le dossier courant par le dossier importé ?')){load(data.answers);save()}}catch(err){alert('Fichier de sauvegarde invalide.')}e.target.value=''});window.addEventListener('beforeprint',update);
</script></body></html>
